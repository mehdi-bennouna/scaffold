name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - name: Smoke test node template
              run: test "$(node templates/node/dist/index.mjs)" = "Hello world!"

    create:
        name: create (${{ matrix.template }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                template: [node, react, monorepo]
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: Create a project from this commit, like users do
              run: node dist/index.mjs "$RUNNER_TEMP/app" --template "$TEMPLATE" --ref "$REF"
              env:
                  TEMPLATE: ${{ matrix.template }}
                  REF: ${{ github.event.pull_request.head.sha || github.sha }}
                  GIGET_AUTH: ${{ github.token }}
            - working-directory: ${{ runner.temp }}/app
              run: pnpm typecheck && pnpm lint && pnpm build
